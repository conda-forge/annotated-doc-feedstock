# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.6"
  python_check_max: "3.15"
  cov_fail_under: "100"

package:
  name: annotated-doc
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/a/annotated-doc/annotated_doc-${{ version }}.tar.gz
    sha256: 7969bb69912085b2285849c0dcac0b4b374fd180c13cf10a87f284ffcf347bbf

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - pdm-backend
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - annotated_doc/**
        - annotated_doc-${{ version }}.dist-info/**
  - python:
      imports: annotated_doc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - scripts/__init__.py
        - scripts/prepare_release.py
        - tests/
    requirements:
      run:
        - pytest-cov
        - python ${{ python_min }}.*
        - typer >=0.16.1
    script:
      - coverage run --source=annotated_doc --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=${{ cov_fail_under }}

about:
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/annotated-doc
  repository: https://github.com/fastapi/annotated-doc
  summary: Document parameters, class attributes, return types, and variables inline, with Annotated.

extra:
  recipe-maintainers:
    - bollwyvl
